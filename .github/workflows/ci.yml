name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  MODEL_DIR: './model'
  APP_DIR: './app'

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
    
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov black flake8 pytest-asyncio httpx

    - name: Train model for testing
      run: |
        python notebook/train_model.py
        ls -la ${{ env.MODEL_DIR }}

    - name: Lint with flake8
      run: |
        flake8 ${{ env.APP_DIR }} --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 ${{ env.APP_DIR }} --count --max-complexity=10 --max-line-length=127 --statistics

    - name: Format with black
      run: |
        black --check --diff ${{ env.APP_DIR }}

    - name: Run tests
      run: |
        python -m pytest ${{ env.APP_DIR }} -v --cov=${{ env.APP_DIR }} --cov-report=xml

    - name: Upload coverage to Codecov
      if: matrix.python-version == env.PYTHON_VERSION
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        fail_ci_if_error: false

  train-model:
    name: Train and Test Model
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Train model
      run: |
        python notebook/train_model.py
        ls -la ${{ env.MODEL_DIR }}

    - name: Test model loading
      run: |
        python -c "import pickle; import os; \
                  pickle.load(open(os.path.join('${{ env.MODEL_DIR }}', 'model.pkl'), 'rb')); \
                  pickle.load(open(os.path.join('${{ env.MODEL_DIR }}', 'scaler.pkl'), 'rb')); \
                  print('Model and scaler loaded successfully')"

  deploy:
    name: Deploy to EC2
    needs: [test, train-model]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
    - uses: actions/checkout@v3

    # ── 1. Write the private key from GitHub Secrets ──────────────────────────
    - name: Configure SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
        chmod 600 ~/.ssh/ec2_key.pem
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

    # ── 2. SSH into EC2, pull latest code, retrain model, restart with PM2 ───
    - name: Deploy on EC2
      run: |
        ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          set -e

          echo "==> Navigating to app directory"
          cd ${{ secrets.EC2_APP_DIR }}   # e.g. /home/ubuntu/my-app

          echo "==> Pulling latest code from main"
          git pull origin main

          echo "==> Activating virtual environment"
          source venv/bin/activate

          echo "==> Installing/updating dependencies"
          pip install -r requirements.txt

          echo "==> Retraining model"
          python notebook/train_model.py

          echo "==> Restarting app with PM2"
          # If the app is already registered in PM2, reload it gracefully.
          # If not, start it for the first time and save the process list.
          if pm2 list | grep -q "fastapi-app"; then
            pm2 reload fastapi-app --update-env
          else
            pm2 start "uvicorn app.main:app --host 0.0.0.0 --port 8000" \
              --name fastapi-app \
              --interpreter python
            pm2 save
          fi

          echo "==> Deployment complete"
        EOF

    # ── 3. Quick smoke-test against the live EC2 endpoint ────────────────────
    - name: Smoke test live API
      run: |
        sleep 5
        curl --fail -X POST "http://${{ secrets.EC2_HOST }}:8000/predict" \
          -H "Content-Type: application/json" \
          -d '{"features": [5.1, 3.5, 1.4, 0.2]}' \
          -v

    # ── 4. Clean up the private key from the runner ───────────────────────────
    - name: Cleanup SSH key
      if: always()
      run: rm -f ~/.ssh/ec2_key.pem
